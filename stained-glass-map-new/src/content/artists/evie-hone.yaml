name: Evie Hone
slug: evie-hone
birth_year: 1894
death_year: 1955
biography: >-
  Evie Hone was a Dublin-born painter and stained-glass artist. After studying in London and Paris,
  she became closely associated with modern art in Ireland. She joined An Túr Gloine in 1933 and
  developed an influential stained-glass practice, including a major window for Eton College Chapel.
sources:
