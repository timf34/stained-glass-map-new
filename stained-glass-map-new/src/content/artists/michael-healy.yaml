name: Michael Healy
slug: michael-healy
birth_year: 1873
death_year: 1941
biography: >-
  Michael Healy was a Dublin-born stained-glass artist and an early member of An
  Túr Gloine. His long association with St. Brendan's Cathedral in Loughrea
  produced some of his most ambitious work, distinguished by rich colour and
  expressive figures.
