name: St. Flannan's Catholic Church, Killaloe
coordinates:
  - 52.807
  - -8.4443
address: Killaloe, Co. Clare
county: Clare
google_maps_link: https://www.google.com/maps/search/?api=1&query=52.807,-8.4443
description: >-
  The Scanlan memorial window stands to the right of the altar in this church near the Shannon. Commissioned
  in 1927, it combines the Presentation in the Temple with smaller scenes above and below.
visit_note: >-
  An active place of worship. Check local access before travelling and avoid services when viewing or
  photographing the windows.
sources:
  - label: 'Clare County Council: Lough Derg heritage trail, p. 61'
    url: >-
      https://www.clarecoco.ie/services/planning/publications/heritageconservation/lough-derg-on-the-shannon-heritage-trail-24576.pdf
windows:
  - title: The Presentation of Christ in the Temple
    artist: harry-clarke
    year: 1927
    description: The main scene is accompanied by the Annunciation above and the Flight into Egypt below.
