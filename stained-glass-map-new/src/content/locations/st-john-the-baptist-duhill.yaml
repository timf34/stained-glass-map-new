name: St. John the Baptist's Church, Duhill
coordinates:
  - 52.29337
  - -7.95139
address: Castlegrace, Duhill, Co. Tipperary
county: Tipperary
google_maps_link: https://www.google.com/maps/search/?api=1&query=52.29337,-7.95139
description: >-
  Two striking Harry Clarke windows sit on either side of the altar in this rural church. Made in 1925, they
  pair the vision at Lourdes with the dramatic story of John the Baptist.
visit_note: >-
  An active place of worship. Check local access before travelling and avoid services when viewing or
  photographing the windows.
sources:
  - label: 'Wikimedia Commons: window documentation'
    url: https://commons.wikimedia.org/wiki/Category:Harry_Clarke,_Beheading_of_John_the_Baptist
  - label: Church location (OpenStreetMap via Mapcarta)
    url: https://mapcarta.com/W1037792218
windows:
  - title: The Vision of Bernadette at Lourdes
    artist: harry-clarke
    year: 1925
    description: The window to the left of the altar surrounds the apparition with dense floral ornament.
