name: St. Brendan's Cathedral, Loughrea
coordinates:
  - 53.197
  - -8.5667
address: Barrack Street, Loughrea, Co. Galway
county: Galway
google_maps_link: https://www.google.com/maps/search/?api=1&query=53.197,-8.5667
description: >-
  An outstanding place to explore the work of An Túr Gloine, the Irish stained-glass studio founded by Sarah
  Purser. Michael Healy's windows here span decades, with deeply layered colour and carefully composed
  figures.
visit_note: >-
  An active place of worship. Check local access before travelling and avoid services when viewing or
  photographing the windows.
sources:
  - label: 'Galway County Heritage Office: cathedral and location'
    url: >-
      https://heritage.galwaycommunityheritage.org/content/places/loughrea-heritage-trail/1-st-brendans-cathedral
  - label: Illustrated Guide to Galway Ecclesiastical Heritage, p. 100
    url: https://dpdgay9x1sxad.cloudfront.net/wp-content/uploads/sites/6/2021/01/The-Illustrated-Guide.pdf
  - label: David Caron on Michael Healy
    url: https://www.thejournal.ie/readme/stained-glass-and-cathedrals-6199616-Oct2023/
windows:
