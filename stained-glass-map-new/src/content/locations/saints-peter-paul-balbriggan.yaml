name: Saints Peter and Paul's Church, Balbriggan
coordinates:
  - 53.60418
  - -6.18384
address: Dublin Street, Balbriggan, Co. Dublin
county: Dublin
google_maps_link: https://www.google.com/maps/search/?api=1&query=53.60418,-6.18384
description: >-
  Two original Harry Clarke windows flank the altar: The Visitation and The Widow's Son. Commissioned in 1923,
  they reward a close look at the jewel-like colour and the smaller scenes beneath the main figures.
visit_note: >-
  An active place of worship. Check local access before travelling and avoid services when viewing or
  photographing the windows.
sources:
  - label: 'Fingal County Council: Harry Clarke windows'
    url: https://www.fingal.ie/directory/amenities/heritage/harry-clarke-stained-glass-windows
  - label: 'Wikimedia Commons: church location'
    url: https://commons.wikimedia.org/wiki/Category:St_Peter_and_Paul%27s_Church,_Balbriggan
windows:
  - title: The Visitation
    artist: harry-clarke
    year: 1924
    description: Mary visits Elizabeth in this two-light window to the right of the altar.
