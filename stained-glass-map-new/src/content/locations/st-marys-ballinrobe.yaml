name: St. Mary's Church, Ballinrobe
coordinates:
  - 53.62186
  - -9.22201
address: Main Street, Ballinrobe, Co. Mayo
county: Mayo
google_maps_link: https://www.google.com/maps/search/?api=1&query=53.62186,-9.22201
description: >-
  A rewarding stop for Harry Clarke's luminous colours and intricate figure work. The church's collection
  includes scenes from the lives of Christ and Mary, alongside Irish saints. The original commission was made
  in 1924.
visit_note: >-
  An active place of worship. Check local access before travelling and avoid services when viewing or
  photographing the windows.
sources:
